 terroir, cultivated in the biodynamic forests of Andhra Pradesh and Karnataka, deserves the reverence typically reserved for grand cru wines.",storyOriginP2:"We eliminated the commercial middlemen to pay an average of 45% above Fair Trade minimums directly to our tribal farming families. Every batch is roasted under controlled ambient heat, and every extraction is dialed in on custom Slayer machines.",storyQuote:`"We don't brew coffee to rush you out the door. We brew coffee so you remember to pause."`,storyQuoteAuthor:"— Vikram Roy, Co-Founder & Head Roaster",storyGalleryBtn:"Open 21-Moment Photo Archive",storyMilestonesHeader:"✦ Milestones & Evolution (2019 – 2026)",milestones:[{year:"2019",title:"The Araku Cloud Forest Journey",desc:"Founders Vikram & Tara spent six months in Araku Valley working alongside adivasi farmer guilds to source shade-grown heirloom varietals."},{year:"2021",title:"The Cast-Iron Roaster Arrives",desc:"Installed our 12kg bespoke vintage roaster in Jubilee Hills, committing to roasting 3 times weekly for absolute peak aromatics."},{year:"2023",title:"The Sourdough & Viennoiserie Bakery",desc:"Expanded with our stone deck pastry kitchen, crafting 72-hour fermented sourdough loaves and laminated butter viennoiserie."},{year:"2026",title:"Hyderabad’s Specialty Flagship",desc:"A multi-sensory haven combining acoustic vinyl soundscapes, high-speed remote creative desks, and biodynamic coffee."}],sustBadge:"Conscious Craft & Ecology",sustTitle:"Sustainability & Regenerative Impact",sustDesc:"Great coffee should restore the earth, not deplete it. We practice zero-waste brewing and direct tribal partnerships.",sustStat1Number:"14,200+",sustStat1Title:"Cups Diverted & Recycled",sustStat1Desc:"Through our bring-your-own-cup discount (₹20 off) and compostable husks program.",sustStat2Number:"+45%",sustStat2Title:"Above Fair Trade Floor",sustStat2Desc:"Paid straight to indigenous adivasi smallholders without middlemen or brokers.",sustStat3Number:"1,
